    <path d="M-10 -120l54 54" stroke="url(#wheatGradient)" stroke-width="18" stroke-linecap="round" />
    <path d="M-10 -60l54 54" stroke="url(#wheatGradient)" stroke-width="18" stroke-linecap="round" />
    <path d="M-10 0l54 54" stroke="url(#wheatGradient)" stroke-width="18" stroke-linecap="round" />
    <path d="M-10 60l54 54" stroke="url(#wheatGradient)" stroke-width="18" stroke-linecap="round" />
    <path d="M-10 120l54 54" stroke="url(#wheatGradient)" stroke-width="18" stroke-linecap="round" />
  </g>

  <g transform="translate(700 520)">
