    <line x1="0" y1="-150" x2="0" y2="-280" stroke="#f2b930" stroke-width="12" stroke-linecap="round" />
    <line x1="-60" y1="-130" x2="-120" y2="-220" stroke="#f2b930" stroke-width="12" stroke-linecap="round" />
    <line x1="60" y1="-130" x2="120" y2="-220" stroke="#f2b930" stroke-width="12" stroke-linecap="round" />
    <line x1="-90" y1="-50" x2="-210" y2="-50" stroke="#f2b930" stroke-width="12" stroke-linecap="round" />
    <line x1="90" y1="-50" x2="210" y2="-50" stroke="#f2b930" stroke-width="12" stroke-linecap="round" />
    <circle cx="0" cy="-280" r="16" fill="#ffe68d" stroke="#c77d0a" stroke-width="4" />
    <circle cx="-120" cy="-220" r="12" fill="#ffe68d" stroke="#c77d0a" stroke-width="4" />
    <circle cx="120" cy="-220" r="12" fill="#ffe68d" stroke="#c77d0a" stroke-width="4" />
    <circle cx="-210" cy="-50" r="12" fill="#ffe68d" stroke="#c77d0a" stroke-width="4" />
    <circle cx="210" cy="-50" r="12" fill="#ffe68d" stroke="#c77d0a" stroke-width="4" />
