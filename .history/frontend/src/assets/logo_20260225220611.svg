  </defs>

  <rect width="1400" height="1400" fill="white" />

  <circle cx="700" cy="520" r="320" fill="url(#circleGradient)" stroke="#0e3b1c" stroke-width="10" />

  <path
    d="M520 360c-90 64-130 150-130 240s56 178 170 206c104-48 152-182 108-302-20-55-60-104-108-144z"
