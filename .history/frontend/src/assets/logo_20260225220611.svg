    <linearGradient id="wheatGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7cd4a" />
      <stop offset="100%" stop-color="#d08a10" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe68d" />
      <stop offset="100%" stop-color="#f2b930" />
