<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Vadhiyar Agrotech logo</title>
  <desc id="logoDesc">Circular agriculture technology emblem with leaf, wheat, sun circuits, and typography</desc>
  <defs>
    <linearGradient id="circleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fff3" />
      <stop offset="100%" stop-color="#d8f2d4" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6b2f" />
      <stop offset="100%" stop-color="#4ec274" />
