      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="40" y="30" width="52" height="34" rx="10" fill="#1f6b2f" />
    <path d="M52 38h28l10 18H42z" fill="#2d8441" />
    <circle cx="62" cy="18" r="10" fill="#f1da57" stroke="#c38a00" stroke-width="3" />
    <rect x="28" y="44" width="12" height="58" rx="6" fill="#0f3c1f" />
  </g>

  <g transform="translate(256 420)" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif">
    <text y="0" font-size="54" font-weight="700" fill="#0f3c1f">VADHIYAR</text>
    <text y="44" font-size="30" letter-spacing="0.4em" fill="#d3a014">AGROTECH</text>
