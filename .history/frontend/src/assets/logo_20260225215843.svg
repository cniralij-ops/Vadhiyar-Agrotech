<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Vadhiyar Agrotech logo</title>
  <desc id="logoDesc">Shield with leaves, spray droplet and farm sprayer icon for agricultural brand</desc>
  <defs>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86d388" />
      <stop offset="70%" stop-color="#1f6b2f" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2f397" />
      <stop offset="100%" stop-color="#2b7d3d" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffef8a" />
      <stop offset="100%" stop-color="#d3a014" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="rgba(22,62,34,0.35)" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path
      d="M256 36c-92 0-188 55-188 146v118c0 107 112 189 188 214 76-25 188-107 188-214V182C444 91 348 36 256 36z"
      fill="url(#shieldGradient)"
      stroke="#0f3c1f"
      stroke-width="8"
      stroke-linejoin="round"
    />
  </g>

  <g transform="translate(256 250)">
    <path
      d="M-18 -90c-34 32-62 78-62 124 0 50 33 84 72 84 39 0 72-34 72-84 0-46-28-92-62-124l-5-4z"
      fill="url(#leafGradient)"
    />
    <path
      d="M0 -86v210"
      stroke="#0e4a29"
      stroke-width="10"
      stroke-linecap="round"
    />
    <path
      d="M10 30c28-10 52-29 72-56-10-36-37-70-72-98"
      stroke="#125932"
      stroke-width="9"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="-88" cy="-134" r="26" fill="url(#accentGradient)" opacity="0.8" />
    <path
      d="M-96 -158c12 12 18 28 18 46"
      stroke="#f4c842"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
      opacity="0.7"
